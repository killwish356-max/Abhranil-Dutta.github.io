<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Mother ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #ff9a9e, #fad0c4, #fad0c4);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .card {
            background: rgba(255,255,255,0.9);
            padding: 40px;
            border-radius: 25px;
            text-align: center;
            max-width: 600px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            color: #e91e63;
            font-size: 3rem;
            margin-bottom: 15px;
        }

        p {
            color: #444;
            font-size: 1.2rem;
            line-height: 1.8;
        }

        .heart {
            font-size: 4rem;
            animation: pulse 1s infinite;
            margin: 20px 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            background: #e91e63;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #c2185b;
            transform: scale(1.05);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .message {
            margin-top: 20px;
            color: #d81b60;
            font-weight: bold;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Dear Mom ❤️</h1>

        <div class="heart">💖</div>

        <p>
            Thank you for your endless love, care, and support.
            Everything I achieve is because of your sacrifices and encouragement.
            You are my first teacher, my biggest supporter, and my greatest inspiration.
        </p>

        <button onclick="showMessage()">
            Click Here Mom 🌸
        </button>

        <div id="message" class="message"></div>
    </div>

    <script>
        function showMessage() {
            document.getElementById("message").innerHTML =
                "🌹 Mom, you are the most beautiful blessing in my life. I love you forever! ❤️";
        }
    </script>

</body>
</html>
